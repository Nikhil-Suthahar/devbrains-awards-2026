<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Apply saved theme immediately (before CSS paints) to avoid a light/dark flash.
  (function () {
    try {
      var raw = localStorage.getItem('sf_settings');
      var settings = raw ? JSON.parse(raw) : null;
      var mode = (settings && settings.appearance) || 'light';
      var effective = mode;
      if (mode === 'system') {
        effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', effective);
    } catch (e) { /* localStorage unavailable — default light theme applies */ }
  })();
</script>
<title>StudyFlow — Plan smarter. Study better.</title>
<meta name="description" content="StudyFlow is an all-in-one study planner and productivity dashboard for students.">
<link rel="icon" href="assets/images/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="splash-screen">
  <div class="splash-orb o1"></div>
  <div class="splash-orb o2"></div>

  <div class="splash-content">
    <div class="splash-fox">
      <img src="assets/images/logo-mark.png" alt="StudyFlow fox mascot">
    </div>
    <h1 class="splash-title">StudyFlow</h1>
    <p class="splash-sub">Plan smarter. Study better. Achieve more.</p>
    <div class="splash-loader"><div class="splash-loader-bar"></div></div>
  </div>
</div>

<script>
  setTimeout(function () {
    window.location.href = 'login.html';
  }, 2000);
</script>
</body>
</html>
