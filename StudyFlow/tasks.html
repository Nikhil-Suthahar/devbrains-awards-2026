<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Apply saved theme immediately (before CSS paints) to avoid a light/dark flash.
  (function () {
    try {
      var raw = localStorage.getItem('sf_settings');
      var settings = raw ? JSON.parse(raw) : null;
      var mode = (settings && settings.appearance) || 'light';
      var effective = mode;
      if (mode === 'system') {
        effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', effective);
    } catch (e) { /* localStorage unavailable — default light theme applies */ }
  })();
</script>
<title>My Tasks — StudyFlow</title>
<link rel="icon" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tasks" data-title="My Tasks">

<div class="sf-sidebar-backdrop"></div>
<div class="app-shell">
  <aside class="sf-sidebar" data-sf-sidebar-slot></aside>

  <div class="sf-main">
    <header class="sf-header" data-sf-header-slot></header>

    <main class="sf-content">

      <div class="sf-card sf-slide-up mb-4">
        <div class="sf-card-body">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
            <div class="sf-filter-tabs" id="taskFilters">
              <button class="sf-filter-tab active" data-filter="all">All</button>
              <button class="sf-filter-tab" data-filter="today">Today</button>
              <button class="sf-filter-tab" data-filter="upcoming">Upcoming</button>
              <button class="sf-filter-tab" data-filter="completed">Completed</button>
              <button class="sf-filter-tab" data-filter="overdue">Overdue</button>
            </div>
            <button class="btn btn-sf-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
              <i class="bi bi-plus-lg me-1"></i>Add Task
            </button>
          </div>
          <div id="taskListWrap"></div>
        </div>
      </div>

    </main>

    <footer class="sf-footer" data-sf-footer-slot></footer>
  </div>
</div>

<!-- Add / Edit Task Modal -->
<div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content sf-card">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="taskModalTitle">Add New Task</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="addTaskForm">
        <input type="hidden" id="taskEditId">
        <div class="modal-body">
          <div class="sf-field">
            <label class="sf-label">Task Name</label>
            <input type="text" class="form-control sf-input" id="taskName" required>
          </div>
          <div class="row">
            <div class="col-6 sf-field">
              <label class="sf-label">Subject</label>
              <input type="text" class="form-control sf-input" id="taskSubject" placeholder="e.g. Mathematics" required>
            </div>
            <div class="col-6 sf-field">
              <label class="sf-label">Priority</label>
              <select class="form-select sf-input" id="taskPriority">
                <option>Low</option><option selected>Medium</option><option>High</option>
              </select>
            </div>
          </div>
          <div class="sf-field">
            <label class="sf-label">Description</label>
            <textarea class="form-control sf-input" id="taskDescription" rows="2"></textarea>
          </div>
          <div class="row">
            <div class="col-6 sf-field">
              <label class="sf-label">Due Date</label>
              <input type="date" class="form-control sf-input" id="taskDueDate" required>
            </div>
            <div class="col-6 sf-field">
              <label class="sf-label">Due Time</label>
              <input type="time" class="form-control sf-input" id="taskDueTime">
            </div>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-sf-outline" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-sf-primary" id="taskSubmitBtn">Add Task</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/tasks.js"></script>
</body>
</html>
