<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  // Apply saved theme immediately (before CSS paints) to avoid a light/dark flash.
  (function () {
    try {
      var raw = localStorage.getItem('sf_settings');
      var settings = raw ? JSON.parse(raw) : null;
      var mode = (settings && settings.appearance) || 'light';
      var effective = mode;
      if (mode === 'system') {
        effective = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', effective);
    } catch (e) { /* localStorage unavailable — default light theme applies */ }
  })();
</script>
<title>Calendar — StudyFlow</title>
<link rel="icon" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="calendar" data-title="Calendar">

<div class="sf-sidebar-backdrop"></div>
<div class="app-shell">
  <aside class="sf-sidebar" data-sf-sidebar-slot></aside>

  <div class="sf-main">
    <header class="sf-header" data-sf-header-slot></header>

    <main class="sf-content">
      <div class="row g-3">
        <div class="col-lg-8">
          <div class="sf-card sf-slide-up">
            <div class="sf-card-body">
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div class="d-flex align-items-center gap-2">
                  <button class="btn-sf-icon" id="prevMonthBtn" aria-label="Previous month"><i class="bi bi-chevron-left"></i></button>
                  <h3 class="h5 mb-0" id="calMonthLabel" style="min-width:170px;text-align:center">Month Year</h3>
                  <button class="btn-sf-icon" id="nextMonthBtn" aria-label="Next month"><i class="bi bi-chevron-right"></i></button>
                </div>
                <div class="d-flex align-items-center gap-2">
                  <button class="btn btn-sf-outline btn-sm" id="todayBtn">Today</button>
                  <button class="btn btn-sf-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addEventModal">
                    <i class="bi bi-plus-lg me-1"></i>Add Event
                  </button>
                </div>
              </div>

              <div class="sf-calendar-grid mb-2">
                <div class="sf-cal-dow">Mon</div><div class="sf-cal-dow">Tue</div><div class="sf-cal-dow">Wed</div>
                <div class="sf-cal-dow">Thu</div><div class="sf-cal-dow">Fri</div><div class="sf-cal-dow">Sat</div><div class="sf-cal-dow">Sun</div>
              </div>
              <div class="sf-calendar-grid" id="calGrid"></div>

              <div class="d-flex flex-wrap gap-3 mt-3 small text-muted-sf">
                <span><span class="sf-legend-dot" style="background:var(--sf-primary)"></span>Homework</span>
                <span><span class="sf-legend-dot" style="background:var(--sf-danger)"></span>Exam</span>
                <span><span class="sf-legend-dot" style="background:var(--sf-success)"></span>Study</span>
                <span><span class="sf-legend-dot" style="background:var(--sf-warning)"></span>Assignment</span>
                <span><span class="sf-legend-dot" style="background:var(--sf-info)"></span>Other</span>
              </div>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div class="sf-card sf-slide-up">
            <div class="sf-card-body">
              <h3 class="h6 mb-3" id="selectedDayLabel">Selected day</h3>
              <div id="selectedDayEvents"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="sf-footer" data-sf-footer-slot></footer>
  </div>
</div>

<!-- Add Event Modal -->
<div class="modal fade" id="addEventModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content sf-card">
      <div class="modal-header border-0">
        <h5 class="modal-title">Add Event</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="addEventForm">
        <div class="modal-body">
          <div class="sf-field">
            <label class="sf-label">Event Name</label>
            <input type="text" class="form-control sf-input" id="eventName" required>
          </div>
          <div class="row">
            <div class="col-6 sf-field">
              <label class="sf-label">Date</label>
              <input type="date" class="form-control sf-input" id="eventDate" required>
            </div>
            <div class="col-6 sf-field">
              <label class="sf-label">Time</label>
              <input type="time" class="form-control sf-input" id="eventTime">
            </div>
          </div>
          <div class="sf-field">
            <label class="sf-label">Type</label>
            <select class="form-select sf-input" id="eventType">
              <option>Homework</option><option>Exam</option><option>Study</option><option>Assignment</option><option>Other</option>
            </select>
          </div>
          <div class="sf-field">
            <label class="sf-label">Description</label>
            <textarea class="form-control sf-input" id="eventDescription" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-sf-outline" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-sf-primary">Add Event</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
